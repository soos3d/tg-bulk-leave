name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A PyPI version is permanent. Without this the only thing between a broken
  # commit and a published release was remembering to check CI on that exact
  # commit by hand.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0

      # Tagging without bumping pyproject.toml publishes something other than
      # what the tag says. Fail here rather than at the environment gate.
      - name: Check the tag matches the packaged version
        run: |
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored in the repository or anywhere else.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
