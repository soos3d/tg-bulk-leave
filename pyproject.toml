[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-bulk-leave"
version = "0.1.0"
description = "Bulk-leave Telegram groups and channels whose title matches a keyword. Dry run by default."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Davide Zambiasi" }]
keywords = ["telegram", "telethon", "cleanup", "bulk-leave", "leave-groups", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.44,<2",
    "python-dotenv>=1.0",
    "platformdirs>=4",
]

[project.scripts]
tg-bulk-leave = "tg_bulk_leave.cli:entrypoint"

[tool.pytest.ini_options]
addopts = "-q --cov=tg_bulk_leave --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tg_bulk_leave"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
