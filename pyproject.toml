[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release2reel"
version = "0.1.0"
description = "Turn your release notes into a product-update video with the Runway API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Davide Zambiasi" }]
keywords = ["runway", "changelog", "video", "release-notes", "devrel", "github-action"]
dependencies = [
    "runwayml>=3.0.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
release2reel = "release2reel.cli:main"

[project.urls]
Homepage = "https://github.com/soos3d/release2reel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
